spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  audio-storage-dir: ${STORAGE_AUDIO_DIR}
  public-base-url: ${APP_PUBLIC_BASE_URL}
  jwt-secret: ${JWT_SECRET}

server:
  address: 127.0.0.1
