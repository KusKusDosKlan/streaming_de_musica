server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: streaming-app
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/streaming_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:streaming_dev}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  audio-storage-dir: ${STORAGE_AUDIO_DIR:./storage/audio}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  # Nunca adicionar um segredo JWT real ao YAML. A implementação JWT ainda precisa ser feita.
  jwt-secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
